name: Bug report
description: Something in ClaudeCounter is not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Before you paste anything: **the log can contain
        OAuth tokens.** Redact any long random-looking string before posting.

  - type: input
    id: version
    attributes:
      label: ClaudeCounter version
      description: Right-click the tray icon -> About ClaudeCounter...
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver`, or Settings -> System -> About
      placeholder: Windows 11 Pro 24H2 (build 26100)
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - Installer (ClaudeCounter-x.y.z-setup.exe)
        - winget
        - Portable zip
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - arm64
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: token-source
    attributes:
      label: Which sign-in is it using?
      description: The flyout says "Using Claude Code's session" when it is on the fallback.
      options:
        - Signed in through ClaudeCounter
        - Falling back to Claude Code's session
        - CLAUDE_CODE_OAUTH_TOKEN environment variable
        - Not signed in / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: |
        From `%LocalAppData%\ClaudeCounter\logs\claudecounter.log`.
        **Redact any token before pasting.** This is rendered as a code block.
      render: text
    validations:
      required: false
