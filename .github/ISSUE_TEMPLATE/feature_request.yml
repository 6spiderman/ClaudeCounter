name: Feature request
description: Suggest an improvement to ClaudeCounter
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. What are you doing when this gets in your way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like ClaudeCounter to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered instead?
    validations:
      required: false
