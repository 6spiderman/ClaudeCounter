name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no leading v), for a dry run'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # 8.0.x is the runtime the tests run on; 10.0.x is the SDK that
          # builds everything. Avalonia 12's source generator needs a newer
          # C# compiler than any 8.0 SDK ships (CS9057), and the highest
          # installed SDK is the one dotnet picks. Runner images happened to
          # preinstall a 10.0 SDK already; this makes it explicit.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ver = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Version '$ver' is not semver. Tag as vMAJOR.MINOR.PATCH[-prerelease]."
          }
          "version=$ver"              >> $env:GITHUB_OUTPUT
          "tag=v$ver"                 >> $env:GITHUB_OUTPUT
          "prerelease=$($ver -like '*-*')".ToLower() >> $env:GITHUB_OUTPUT
          Write-Host "Building $ver"

      # Locked mode fails the build outright if a resolved package version
      # drifts from packages.lock.json - a compromised or silently-bumped
      # upstream release cannot change what a tagged release ships.
      - name: Restore
        run: dotnet restore ClaudeCounter.sln --locked-mode

      # Never publish a red tag.
      - name: Test
        run: dotnet test ClaudeCounter.sln -c Release --no-restore

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/ClaudeCounter/ClaudeCounter.csproj `
              -c Release -r $rid --self-contained true --no-restore `
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
              -p:DebugType=none -p:Version=$env:VERSION `
              -o "dist/$rid"
            if ($LASTEXITCODE -ne 0) { throw "publish failed for $rid" }

            dotnet publish src/ClaudeBackup/ClaudeBackup.csproj `
              -c Release -r $rid --self-contained true --no-restore `
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
              -p:DebugType=none -p:Version=$env:VERSION `
              -o "dist/$rid"
            if ($LASTEXITCODE -ne 0) { throw "worker publish failed for $rid" }

            # A single-file publish should leave exactly one file per exe. A
            # stray .dll means something did not get embedded and the
            # portable zip would be broken for anyone who unzips only the exe.
            $allowed = @('ClaudeCounter.exe', 'ClaudeBackup.exe')
            $stray = Get-ChildItem "dist/$rid" -File | Where-Object { $allowed -notcontains $_.Name }
            if ($stray) {
              throw "Unexpected files alongside the exes for ${rid}: $($stray.Name -join ', '). Add -p:IncludeNativeLibrariesForSelfExtract=true."
            }
          }

      # No version pin: the arm64 architecture identifiers used in
      # ClaudeCounter.iss need Inno Setup 6.3+, and hosted runners already ship
      # something newer than that. An exact old pin broke here the moment the
      # runner image's bundled version moved past it - `choco install` refuses
      # to downgrade without --force. `choco install` on an already-present
      # package is a no-op that exits 0, so this is safe to run unconditionally.
      - name: Ensure Inno Setup is present
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at $iscc after installing Inno Setup"
          }
          Write-Host "Inno Setup version: $((Get-Item $iscc).VersionInfo.ProductVersion)"

      - name: Build installers
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          foreach ($arch in 'x64', 'arm64') {
            $src = Resolve-Path "dist/win-$arch"
            & $iscc "/DAppVersion=$env:VERSION" "/DArch=$arch" "/DSourceDir=$src" `
                    packaging\inno\ClaudeCounter.iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed for $arch" }
          }

      - name: Build portable archives
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          foreach ($arch in 'x64', 'arm64') {
            $staging = "dist/portable-$arch"
            New-Item -ItemType Directory -Force $staging | Out-Null
            Copy-Item "dist/win-$arch/ClaudeCounter.exe" $staging
            Copy-Item "dist/win-$arch/ClaudeBackup.exe" $staging
            Copy-Item LICENSE   "$staging/LICENSE.txt"
            Copy-Item README.md $staging
            Compress-Archive -Path "$staging/*" `
              -DestinationPath "dist/ClaudeCounter-$env:VERSION-$arch-portable.zip" -Force
          }

      - name: Hash artifacts
        shell: pwsh
        run: |
          Get-ChildItem dist -File |
            Where-Object Extension -in '.exe', '.zip' |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } |
            Set-Content dist/SHA256SUMS.txt -Encoding ascii

          Get-Content dist/SHA256SUMS.txt

      - name: Compose release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $sections = [System.Collections.Generic.List[string]]::new()

          # Lift this version's section out of the changelog, if it has one.
          if (Test-Path CHANGELOG.md) {
            $changelog = Get-Content CHANGELOG.md -Raw
            $heading = '## [' + $env:VERSION + ']'
            $pattern = '(?ms)^' + [regex]::Escape($heading) + '.*?(?=^## |\z)'
            $match = [regex]::Match($changelog, $pattern)
            if ($match.Success) { $sections.Add($match.Value.Trim()) }
            else { Write-Host "::warning::No CHANGELOG section for $env:VERSION" }
          }

          # Built as an array joined with a newline, not a here-string: a
          # PowerShell here-string's closing '@ must sit at column 0, which
          # would end this YAML block scalar early (it requires every content
          # line to stay indented) and corrupt the rest of the file - exactly
          # what happened here originally, silently, because nothing had
          # actually parsed this file as YAML before it reached GitHub.
          $sections.Add(@(
            '## Install'
            ''
            '**Windows:** run `ClaudeCounter-' + $env:VERSION + '-x64-setup.exe` (or `-arm64-setup.exe`), or unzip a portable archive.'
            ''
            '**Ubuntu, Kubuntu, Debian and derivatives:** download `ClaudeCounter-' + $env:VERSION + '-x64.deb` (or `-arm64.deb`) and install it with apt, which also pulls in its dependencies:'
            ''
            '```bash'
            'sudo apt install ./ClaudeCounter-' + $env:VERSION + '-x64.deb'
            '```'
            ''
            '**Fedora, openSUSE:** `sudo dnf install ./ClaudeCounter-' + $env:VERSION + '-x64.rpm`. Other distributions: unpack a `-portable.tar.gz` and run `ClaudeCounter`.'
            ''
            'See the README for first-run setup, the tray on GNOME, and autostart.'
          ) -join "`n")

          $sections.Add(@(
            '## Verify your download'
            ''
            'Releases are not code-signed, so Windows SmartScreen will warn about them.'
            'Check the hash of what you downloaded against the list below before running it:'
            ''
            '```powershell'
            'Get-FileHash .\<the file you downloaded> -Algorithm SHA256'
            '```'
            ''
            'Linux packages are listed in `SHA256SUMS-linux.txt`, attached to this release:'
            ''
            '```bash'
            'sha256sum --check --ignore-missing SHA256SUMS-linux.txt'
            '```'
          ) -join "`n")

          $sections.Add("``````" + "`n" + (Get-Content dist/SHA256SUMS.txt -Raw).Trim() + "`n" + "``````")

          $sections.Add(@(
            'If SmartScreen blocks the installer, choose **More info** then **Run anyway**.'
            ''
            '> ClaudeCounter is not affiliated with, endorsed by, or supported by Anthropic.'
          ) -join "`n")

          ($sections -join "`n`n") | Set-Content dist/RELEASE_NOTES.md -Encoding utf8
          Get-Content dist/RELEASE_NOTES.md

      # Skipped on workflow_dispatch: that path is for rehearsing a build, and
      # `gh release create` would create the tag as a side effect.
      - name: Create GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $ghArgs = [System.Collections.Generic.List[string]]::new()
          $ghArgs.AddRange([string[]]@('release', 'create', $env:TAG))
          $ghArgs.AddRange([string[]](Get-ChildItem dist/*-setup.exe, dist/*-portable.zip |
            ForEach-Object FullName))
          $ghArgs.Add('dist/SHA256SUMS.txt')
          $ghArgs.AddRange([string[]]@('--title', "ClaudeCounter $env:TAG"))
          $ghArgs.AddRange([string[]]@('--notes-file', 'dist/RELEASE_NOTES.md'))
          if ($env:PRERELEASE -eq 'true') { $ghArgs.Add('--prerelease') }

          gh @ghArgs

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

  release-linux:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # 8.0.x is the runtime the tests run on; 10.0.x is the SDK that
          # builds everything. Avalonia 12's source generator needs a newer
          # C# compiler than any 8.0 SDK ships (CS9057), and the highest
          # installed SDK is the one dotnet picks. Runner images happened to
          # preinstall a 10.0 SDK already; this makes it explicit.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: |
          dotnet restore src/ClaudeCounter.Core/ClaudeCounter.Core.csproj --locked-mode
          dotnet restore src/ClaudeCounter.Linux/ClaudeCounter.Linux.csproj --locked-mode
          dotnet restore src/ClaudeBackup/ClaudeBackup.csproj --locked-mode
          dotnet restore tests/ClaudeCounter.Core.Tests/ClaudeCounter.Core.Tests.csproj --locked-mode

      # Never publish a red tag - on Linux either.
      - name: Test
        run: dotnet test tests/ClaudeCounter.Core.Tests/ClaudeCounter.Core.Tests.csproj -c Release --no-restore

      # linux-arm64 is cross-published from this x64 runner, the same way the
      # Windows job already cross-publishes win-arm64 - self-contained
      # publish just fetches the target RID's runtime and native (SkiaSharp,
      # HarfBuzzSharp) assets via NuGet, no actual arm64 execution needed to
      # produce it. It has not been run on real arm64 hardware - see the
      # README caveat.
      - name: Publish
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -e
          for rid in linux-x64 linux-arm64; do
            dotnet publish src/ClaudeCounter.Linux/ClaudeCounter.Linux.csproj \
              -c Release -r "$rid" --self-contained true --no-restore \
              -p:PublishSingleFile=true -p:DebugType=none -p:Version="$VERSION" \
              -o "dist/$rid"

            dotnet publish src/ClaudeBackup/ClaudeBackup.csproj \
              -c Release -r "$rid" --self-contained true --no-restore \
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true \
              -p:DebugType=none -p:Version="$VERSION" \
              -o "dist/$rid"

            stray=$(find "dist/$rid" -maxdepth 1 -type f ! -name ClaudeCounter ! -name ClaudeBackup)
            if [ -n "$stray" ]; then
              echo "Unexpected files alongside the exe for $rid: $stray" >&2
              exit 1
            fi
          done

      - name: Install Xvfb and D-Bus
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11

      # Only the natively-built x64 binary - arm64 is cross-published above
      # and cannot actually run on this runner's amd64 CPU. See
      # packaging/smoke-test.sh for what this checks and why.
      - name: Startup smoke test
        run: |
          chmod +x packaging/smoke-test.sh
          xvfb-run -a dbus-run-session -- packaging/smoke-test.sh dist/linux-x64/ClaudeCounter

      # Pinned by hash, same reasoning as packages.lock.json: a compromised or
      # silently-bumped upstream release must not change what a tagged
      # release ships.
      - name: Install nfpm
        env:
          NFPM_VERSION: 2.47.0
          NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
        run: |
          curl -sL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum -c -
          tar xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          chmod +x /tmp/nfpm
          echo /tmp >> "$GITHUB_PATH"

      # nfpm resolves contents[].src relative to the working directory it is
      # run from, not the config file - see packaging/nfpm/nfpm.yaml - hence
      # cd'ing into packaging/nfpm and staging the binary at build/ first.
      - name: Build packages and portable archives
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -e
          declare -A nfpm_arch=( [linux-x64]=amd64 [linux-arm64]=arm64 )
          declare -A label=( [linux-x64]=x64 [linux-arm64]=arm64 )

          # The widget's version follows the release, like the binaries'.
          widget=packaging/plasmoid/com.github.6spiderman.claudecounter
          sed -i "s/\"Version\": \"[^\"]*\"/\"Version\": \"$VERSION\"/" "$widget/metadata.json"
          python3 -m json.tool "$widget/metadata.json" > /dev/null
          grep -q "\"Version\": \"$VERSION\"" "$widget/metadata.json"

          for rid in linux-x64 linux-arm64; do
            arch="${nfpm_arch[$rid]}"
            lbl="${label[$rid]}"

            mkdir -p packaging/nfpm/build
            cp "dist/$rid/ClaudeCounter" packaging/nfpm/build/ClaudeCounter
            cp "dist/$rid/ClaudeBackup" packaging/nfpm/build/ClaudeBackup
            (
              cd packaging/nfpm
              VERSION="$VERSION" ARCH="$arch" nfpm package --config nfpm.yaml \
                --packager deb --target "../../dist/ClaudeCounter-$VERSION-$lbl.deb"
              VERSION="$VERSION" ARCH="$arch" nfpm package --config nfpm.yaml \
                --packager rpm --target "../../dist/ClaudeCounter-$VERSION-$lbl.rpm"
            )

            staging="dist/portable-$lbl"
            mkdir -p "$staging"
            cp "dist/$rid/ClaudeCounter" "$staging/"
            cp "dist/$rid/ClaudeBackup" "$staging/"
            cp LICENSE "$staging/LICENSE.txt"
            cp README.md "$staging/"
            cp -r "$widget" "$staging/plasma-widget"
            tar czf "dist/ClaudeCounter-$VERSION-$lbl-portable.tar.gz" -C "$staging" .
          done

      # Same check as CI's: every dependency name in nfpm.yaml must resolve
      # on Ubuntu, or users hit it at install time. x64 only - the runner
      # cannot install an arm64 package.
      - name: Package install test
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -e
          sudo apt-get install -y "./dist/ClaudeCounter-$VERSION-x64.deb"
          test "$(readlink -f /usr/bin/claudecounter)" = /usr/lib/claudecounter/ClaudeCounter
          test -x /usr/lib/claudecounter/ClaudeBackup
          test -f /usr/share/plasma/plasmoids/com.github.6spiderman.claudecounter/metadata.json
          set +e
          timeout 20 claudecounter --status
          code=$?
          set -e
          test "$code" -eq 1
          sudo apt-get remove -y claudecounter

      # A separate file from the Windows job's SHA256SUMS.txt: the two jobs
      # run on different runners and cannot safely append to one file without
      # a race, and gh release upload would need --clobber either way if they
      # shared a name.
      - name: Hash artifacts
        run: |
          cd dist
          sha256sum ClaudeCounter-*.deb ClaudeCounter-*.rpm ClaudeCounter-*-portable.tar.gz \
            > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      # --clobber makes a rerun of this job safe: it replaces its own assets
      # on the release rather than failing because they already exist.
      - name: Upload to release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            dist/ClaudeCounter-*.deb dist/ClaudeCounter-*.rpm \
            dist/ClaudeCounter-*-portable.tar.gz dist/SHA256SUMS-linux.txt \
            --clobber

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*-portable.tar.gz
            dist/SHA256SUMS-linux.txt
