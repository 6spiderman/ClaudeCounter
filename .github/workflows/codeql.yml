name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches new query packs / advisories against unchanged code.
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # The analyze step calls GET /repos/{owner}/{repo}/actions/runs/{run_id} to
  # attach results to the correct run; without this it fails late, after the
  # scan itself already completed, with "Resource not accessible by
  # integration" on that endpoint specifically.
  actions: read

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: csharp

      # The solution builds cleanly with plain `dotnet build`; no custom
      # build steps are needed for CodeQL to trace it.
      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: '/language:csharp'
