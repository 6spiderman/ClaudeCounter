name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches new query packs / advisories against unchanged code.
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # The analyze step calls GET /repos/{owner}/{repo}/actions/runs/{run_id} to
  # attach results to the correct run; without this it fails late, after the
  # scan itself already completed, with "Resource not accessible by
  # integration" on that endpoint specifically.
  actions: read

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          languages: csharp

      # The solution builds cleanly with plain `dotnet build`; no custom
      # build steps are needed for CodeQL to trace it.
      - uses: github/codeql-action/autobuild@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4

      - uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          category: '/language:csharp'
