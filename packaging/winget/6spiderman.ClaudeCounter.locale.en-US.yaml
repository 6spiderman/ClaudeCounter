ShortDescription: Your Claude plan usage in the Windows system tray.

Description: |-
  ClaudeCounter is a lightweight Windows system-tray monitor for your Claude
  Pro or Max plan usage. The tray icon shows your current five-hour session
  utilization and changes colour as you approach your limit; a flyout breaks
  out the rolling seven-day window, the per-model windows, and a countdown to
  each reset.

  It signs in through your browser and keeps its own session, so it does not
  need the Claude Code CLI installed and does not interfere with it. Polling
  interval, warning thresholds and start-with-Windows are configurable. No
  background service, no admin rights, no telemetry.

  Not affiliated with, endorsed by, or supported by Anthropic.

