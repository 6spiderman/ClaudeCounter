# nfpm config - builds both the .deb and the .rpm from one file, so there is
# one packaging path to maintain instead of two (see the Linux-port plan).
#
# nfpm resolves every relative path (contents[].src, --target, ...) against
# the CURRENT WORKING DIRECTORY, not against this file's location - so nfpm
# must be run FROM this directory, and the binary staged at the fixed path
# below first, since nfpm globs contents[].src before ${VERSION}/${ARCH}
# substitution runs (which does work, but only on top-level scalar fields
# like these two - verified against this nfpm version, 2.47.0):
#
#   cd packaging/nfpm
#   cp ../../dist/linux-x64/ClaudeCounter build/ClaudeCounter
#   VERSION=1.2.3 ARCH=amd64 \
#     nfpm package --config nfpm.yaml --packager deb \
#       --target ../../dist/ClaudeCounter-1.2.3-amd64.deb
---
name: "claudecounter"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
section: "utils"
priority: "optional"
maintainer: "6spiderman <6spiderman@users.noreply.github.com>"
description: |
  Claude plan usage in the system tray.
  Shows your five-hour session, weekly, and per-model Claude usage windows in
  a lightweight tray icon, with a countdown to each reset. Unofficial - not
  affiliated with, endorsed by, or supported by Anthropic.
vendor: "6spiderman"
homepage: "https://github.com/6spiderman/ClaudeCounter"
license: "MIT"

contents:
  - src: build/ClaudeCounter
    dst: /usr/lib/claudecounter/ClaudeCounter
    file_info:
      mode: 0755

  - src: /usr/lib/claudecounter/ClaudeCounter
    dst: /usr/bin/claudecounter
    type: symlink

  # The backup worker. The tray finds it next to its own binary (see
  # BackupTaskManager.WorkerPath) and shows the Backup settings only when it
  # is there; the systemd user timer it registers runs it from this path.
  - src: build/ClaudeBackup
    dst: /usr/lib/claudecounter/ClaudeBackup
    file_info:
      mode: 0755

  - src: ../../assets/icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/claudecounter.svg

  - src: claudecounter.desktop
    dst: /usr/share/applications/claudecounter.desktop

  # The KDE Plasma 6 panel widget (right-click the panel > Add Widgets >
  # ClaudeCounter). It only runs `claudecounter --status --json`; outside
  # Plasma nothing reads these files, so it is harmless there.
  - src: ../plasmoid/com.github.6spiderman.claudecounter/
    dst: /usr/share/plasma/plasmoids/com.github.6spiderman.claudecounter/
    type: tree

# Runtime dependencies. The binary is a self-contained .NET publish, so no
# .NET runtime is needed, but it still links or dlopens these system
# libraries - list taken from a running instance's mapped libraries on
# Kubuntu 26.04: OpenSSL for every HTTPS call, fontconfig/freetype for Skia
# text, the X11 client libraries Avalonia's X11 backend loads (it runs under
# XWayland on a Wayland session), and libSM/libICE for X11 session
# management, which is how the desktop's logout/shutdown request reaches the
# app. Alternatives cover the Debian/Ubuntu t64 renames and older releases.
#
# Recommends (installed by default by apt, skippable):
#   libsecret-tools - secret-tool, so the session is kept in the desktop
#     keyring (KWallet on KDE, GNOME Keyring) instead of the encrypted-file
#     fallback. Not installed by default on Kubuntu.
#   libgl1 - hardware-accelerated rendering; Avalonia falls back to software.
#   xdg-utils, libnotify-bin - opening the browser/log folder, and the
#     "no system tray found" notification.
#
# Suggests only, never Recommends: gnome-shell-extension-appindicator. It is
# what a stock GNOME desktop needs to show any tray icon at all, but it
# depends on gnome-shell, and apt installs Recommends by default - as a
# Recommends it pulled GNOME Shell onto KDE/XFCE systems that already have a
# tray. The app's own runtime check (TrayPresence in ClaudeCounter.Linux) and
# the README tell GNOME users to install it.
overrides:
  deb:
    depends:
      - libc6
      - libgcc-s1
      - libstdc++6
      - zlib1g
      - libssl3t64 | libssl3 | libssl1.1
      - libfontconfig1
      - libfreetype6
      - libx11-6
      - libice6
      - libsm6
      - libxcursor1
      - libxext6
      - libxi6
      - libxrandr2
      - libxrender1
    recommends:
      - libsecret-tools
      - libgl1
      - xdg-utils
      - libnotify-bin
    suggests:
      - gnome-shell-extension-appindicator
  rpm:
    depends:
      - glibc
      - libstdc++
      - zlib
      - openssl-libs
      - fontconfig
      - freetype
      - libX11
      - libICE
      - libSM
      - libXcursor
      - libXext
      - libXi
      - libXrandr
      - libXrender
    recommends:
      - libsecret
      - mesa-libGL
      - xdg-utils
      - libnotify
    suggests:
      - gnome-shell-extension-appindicator
